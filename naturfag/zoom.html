<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoom inn i stoffet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Ett bilde som fyller skjermen, med tekst og styring lagt oppå. Siden er mørk med vilje, som et mikroskop. */
:root {
  color-scheme: dark;
  --bg: #080c12; --panel: #121a24; --card: #1b2632; --ink: #e8eef4; --ink-soft: #a3b4c5; --rule: #2b3947;
  --accent: #5aa0ff; --glass: rgba(10,15,22,.74);
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
       display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: .45rem .85rem; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #08121f; font-weight: 700; }

.top { display: flex; align-items: center; gap: .5rem .9rem; flex-wrap: wrap; padding: .55rem max(.9rem, env(safe-area-inset-right, 0px)) .55rem max(.9rem, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--rule); background: var(--panel); }
.top h1 { margin: 0; font-size: 1.05rem; white-space: nowrap; }
.velg { display: flex; gap: .35rem; }
.velg button { border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: .35rem .85rem; cursor: pointer; }
.velg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #08121f; font-weight: 700; }
.grow { flex: 1; }

.scene { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: ns-resize; background: var(--bg); }
#lerret { width: 100%; height: 100%; display: block; }
.merke { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: .8rem; text-align: center; pointer-events: none;
         text-shadow: 0 2px 10px rgba(0,0,0,.85); width: min(56ch, calc(100% - 2rem)); }
.merke::before { content: ""; position: absolute; left: 50%; top: -.8rem; transform: translateX(-50%);
  width: 200vw; height: 190%; background: linear-gradient(180deg, rgba(6,9,14,.78), rgba(6,9,14,0)); z-index: -1; }
.merke h2 { margin: 0; font-size: clamp(1.1rem, .8rem + 1.2vw, 1.7rem); text-wrap: balance; }
.merke p { margin: .25rem 0 0; color: var(--ink-soft); font-size: .95rem; line-height: 1.4; text-wrap: pretty; }
.nede { position: absolute; left: .9rem; right: .9rem; bottom: .9rem; display: flex; align-items: flex-end; gap: .6rem; pointer-events: none; }
.tall { flex: none; }
.tall, .forklaring, .modellnote { background: var(--glass); border: 1px solid var(--rule); border-radius: 12px; }
.tall { padding: .5rem .8rem; line-height: 1.3; }
.tall .stor { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tall .liten { font-size: .85rem; color: var(--ink-soft); }
.forklaring { display: flex; flex-wrap: wrap; gap: .25rem .8rem; padding: .45rem .7rem; font-size: .85rem; min-width: 0; }
.forklaring span { display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; }
.forklaring i { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.35); }
.modellnote { margin: 0 0 0 auto; flex: 0 1 34ch; min-width: 18ch; font-size: .82rem; color: var(--ink-soft); padding: .45rem .7rem; line-height: 1.35; }
.feil { position: absolute; inset: 0; display: grid; place-items: center; padding: 1.5rem; text-align: center; line-height: 1.5; }
.feil div { max-width: 44ch; }
.feil a { color: var(--accent); }

.styring { display: flex; align-items: center; gap: .6rem; padding: .55rem max(.9rem, env(safe-area-inset-right, 0px)) .55rem max(.9rem, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--rule); background: var(--panel); }
.styring input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.styring .sq { width: 2.2rem; padding: .35rem 0; text-align: center; font-size: 1.1rem; }
@media (max-width: 620px) {
  .top h1 { font-size: .95rem; }
  .merke p { font-size: .85rem; }
  .modellnote { display: none; }
  .tall .stor { font-size: 1.1rem; }
}
</style>
</head>
<body>

<header class="top">
  <h1>🔬 Zoom inn i stoffet</h1>
  <div class="velg" id="velg"></div>
  <span class="grow"></span>
  <button class="btn" id="reisBtn">▶ Reis innover</button>
  <button class="btn" id="utBtn">Helt ut</button>
  <a class="btn" href="./">Meny</a>
</header>

<div class="scene" id="scene">
  <canvas id="lerret"></canvas>
  <div class="merke"><h2 id="tittel"></h2><p id="tekst"></p></div>
  <div class="nede">
    <div class="tall"><div class="stor" id="forstorrelse">×1</div><div class="liten" id="bredde"></div></div>
    <div class="forklaring" id="forklaring" hidden></div>
    <p class="modellnote" id="modellnote" hidden></p>
  </div>
</div>

<div class="styring">
  <button class="btn sq" id="utZoom" aria-label="Zoom ut">−</button>
  <input type="range" id="skyv" min="0" max="1000" value="0" aria-label="Zoom">
  <button class="btn sq" id="innZoom" aria-label="Zoom inn">+</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= Zoom inn i stoffet, versjon 2 =================
// Hele reisen styres av ett tall: hvor bredt utsnittet er, målt i meter.
// Hvert nivå er en egen 3D-scene i sin egen måleenhet (cm, ångstrøm, femtometer ...),
// slik at tallene aldri blir for små for datamaskinen. Nivåene tones inn og ut over hverandre.
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const REF = 0.3;                         // bredden på bildet slik vi ser det på en skjerm, i meter
const jevn = f => f <= 0 ? 0 : f >= 1 ? 1 : f * f * (3 - 2 * f);
const mellom = (a, b, t) => a + (b - a) * t;
function lagRnd(frø) {                   // tilfeldige tall som blir like hver gang
  let s = frø >>> 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let bredde = REF, valgt = 'vann', tid = 0, reiser = false, sisteRamme = 0;
let W = 1, H = 1, aspekt = 1;
const lerret = $('lerret');
let renderer = null;
try {
  if (window.THREE) renderer = new THREE.WebGLRenderer({ canvas: lerret, antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }

// På stående skjermer vises et smalere utsnitt, så motivet ikke blir bitte lite
const synligBredde = () => bredde * (aspekt >= 1.3 ? 1 : Math.max(0.6, aspekt / 1.3));

// ---------- tall og tekst ----------
const NORSK = [[1e12, 'billioner'], [1e9, 'milliarder'], [1e6, 'millioner'], [1e3, 'tusen']];
function forstørrelse(b) {
  const f = REF / b;
  if (f < 1000) return '×' + (f < 10 ? Math.round(f * 10) / 10 : Math.round(f)).toLocaleString('nb-NO');
  for (const [grense, ord] of NORSK) if (f >= grense) {
    const t = f / grense;
    return '×' + (t >= 100 ? Math.round(t) : +t.toFixed(t >= 10 ? 0 : 1)).toLocaleString('nb-NO') + ' ' + ord;
  }
}
function lengde(m) {
  const enheter = [[1, 'm'], [1e-2, 'cm'], [1e-3, 'mm'], [1e-6, 'µm'], [1e-9, 'nm'], [1e-12, 'pm'], [1e-15, 'fm']];
  for (const [f, navn] of enheter) if (m >= f * 0.999) {
    const v = m / f;
    return (v >= 100 ? Math.round(v) : +v.toFixed(v >= 10 ? 0 : 1)).toLocaleString('nb-NO') + ' ' + navn;
  }
  return (m / 1e-15).toFixed(1).replace('.', ',') + ' fm';
}

// ---------- felles 3D-hjelp ----------
let omgivelse = null;
const kamera = window.THREE ? new THREE.PerspectiveCamera(26, 1, 0.1, 100) : null;
const NULL3 = window.THREE ? new THREE.Vector3() : null;
// farger skrives slik de skal se ut på skjermen, og regnes om til lysverdier
const farge = hex => new THREE.Color(hex).convertSRGBToLinear();

function lagOmgivelse() {
  // Et enkelt «fotostudio» som alt blankt speiler: lys himmel, mørkt gulv og tre lyskasser
  const s = new THREE.Scene();
  const hg = new THREE.SphereGeometry(50, 32, 24), hp = hg.attributes.position, hc = new Float32Array(hp.count * 3);
  for (let i = 0; i < hp.count; i++) {
    const t = jevn((hp.getY(i) / 50 + 0.25) / 1.2);
    hc[i * 3] = mellom(0.03, 0.42, t); hc[i * 3 + 1] = mellom(0.035, 0.48, t); hc[i * 3 + 2] = mellom(0.045, 0.58, t);
  }
  hg.setAttribute('color', new THREE.BufferAttribute(hc, 3));
  s.add(new THREE.Mesh(hg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const kasse = (x, y, z, b, h, styrke) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(b, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(styrke, styrke, styrke * 1.04), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  kasse(-20, 24, 16, 18, 12, 7); kasse(24, 9, -4, 7, 16, 3.2); kasse(2, -3, 28, 30, 5, 0.9);
  const pm = new THREE.PMREMGenerator(renderer);
  const t = pm.fromScene(s, 0.03).texture;
  pm.dispose();
  return t;
}
function lysSett(scene, styrke) {
  scene.environment = omgivelse;
  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x1a1c22, 0.55 * (styrke || 1)));
  const sol = new THREE.DirectionalLight(0xfff4e4, 1.15 * (styrke || 1));
  sol.position.set(-4, 7, 6); scene.add(sol);
  const mot = new THREE.DirectionalLight(0x9fc0ff, 0.35 * (styrke || 1));
  mot.position.set(6, -2, -5); scene.add(mot);
}

// ---------- nivåer ----------
// vis = [a, b, c, d]: usynlig når utsnittet er bredere enn a, helt synlig mellom b og c, borte under d
function nivå(o) { return Object.assign({ scene: new THREE.Scene(), mat: [], bygget: false, enhet: 1 }, o); }
function reg(n, m) { m.userData.basis = m.opacity; m.userData.gjennom = m.transparent; n.mat.push(m); return m; }
function settAlfa(n, a) {
  for (const m of n.mat) {
    if (m.uniforms && m.uniforms.uAlfa) m.uniforms.uAlfa.value = a;
    else { m.opacity = a * m.userData.basis; m.transparent = m.userData.gjennom || a < 0.999; }
  }
}
function vindu(v, b) {
  const l = Math.log10(b), A = Math.log10(v[0]), B = Math.log10(v[1]), C = Math.log10(v[2]), D = Math.log10(v[3]);
  if (l >= A || l <= D) return 0;
  if (l > B) return jevn((A - l) / (A - B));
  if (l < C) return jevn((l - D) / (C - D));
  return 1;
}
const framdrift = (fra, til, b) => Math.max(0, Math.min(1, (Math.log10(fra) - Math.log10(b)) / (Math.log10(fra) - Math.log10(til))));

const _ret = window.THREE ? new THREE.Vector3() : null;
function stillKamera(n) {
  const k = n.kamera ? n.kamera(bredde) : {};
  const mål = k.mål || NULL3;
  const høyde = (k.høyde || 0), sving = (k.sving || 0) + Math.sin(tid * 0.23) * 0.045;   // liten pendling gir dybdefølelse
  _ret.set(Math.sin(sving) * Math.cos(høyde), Math.sin(høyde), Math.cos(sving) * Math.cos(høyde));
  const bU = synligBredde() / n.enhet, hU = bU / aspekt;
  const d = (hU / 2) / Math.tan(THREE.MathUtils.degToRad(kamera.fov / 2));
  kamera.position.copy(mål).addScaledVector(_ret, d);
  kamera.up.set(0, 1, 0); kamera.lookAt(mål);
  kamera.near = Math.max(d * 0.04, d - (k.foran !== undefined ? k.foran : d * 0.9));
  kamera.far = d + (k.bak !== undefined ? k.bak : d * 30);
  kamera.updateProjectionMatrix();
  if (n.scene.fog) {
    n.scene.fog.near = d + (k.tåkeNær !== undefined ? k.tåkeNær : 0);
    n.scene.fog.far = d + (k.tåkeFjern !== undefined ? k.tåkeFjern : bU * 3);
  }
  return { d, bU };
}

// ================= Bakteppet =================
// Én flate bak alt annet. Fargen følger hvor langt inn vi er, og i vann tegner den lysspill
// som ligger fast i rommet, slik at det kjennes at vi zoomer selv om vannet er helt jevnt.
const bakScene = new THREE.Scene(), bakKamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bakMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    uTid: { value: 0 }, uL2: { value: 0 }, uAspekt: { value: 1 },
    uTopp: { value: new THREE.Color() }, uBunn: { value: new THREE.Color() },
    uKaustikk: { value: 0 }, uKorn: { value: 0 }, uKornCeller: { value: 1 }, uSkille: { value: 0 }
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTid, uL2, uAspekt, uKaustikk, uKorn, uKornCeller, uSkille;
    uniform vec3 uTopp, uBunn;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float stoy(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
    void main(){
      vec2 p = (vUv - 0.5) * vec2(uAspekt, 1.0);
      float y = mix(smoothstep(0.0, 1.0, vUv.y), smoothstep(0.47, 0.53, vUv.y), uSkille);
      vec3 c = mix(uBunn, uTopp, y);
      if (uKaustikk > 0.001) {
        float fr = fract(uL2), sum = 0.0, vekt = 0.0;
        for (int i = 0; i < 5; i++) {
          float e = fr + float(i) - 1.0;
          float t = (e + 1.0) / 5.0;
          float w = sin(3.14159 * t); w *= w;
          float k = floor(uL2) - float(i) + 1.0;          // hvilken fysisk størrelse dette laget har
          vec2 q = p * exp2(e) * 1.5 + vec2(k * 17.13, k * 9.71);
          q += vec2(uTid * 0.035, uTid * 0.024) * (1.0 + mod(k, 3.0) * 0.5);
          float n1 = stoy(q), n2 = stoy(q * 1.9 + 7.3 + n1 * 1.4);
          float r = 1.0 - abs(2.0 * n2 - 1.0);
          sum += w * pow(r, 6.0); vekt += w;
        }
        c += uKaustikk * (sum / vekt) * vec3(0.5, 0.78, 1.0) * (0.3 + 0.7 * vUv.y);
      }
      if (uKorn > 0.001) {
        vec2 g = p * uKornCeller;
        float n = stoy(g + uTid * vec2(1.7, -1.3)) * 0.6 + stoy(g * 2.1 - uTid * vec2(1.1, 2.3)) * 0.4;
        c += uKorn * (n - 0.5) * vec3(0.55, 0.7, 0.95);
      }
      float v = smoothstep(1.3, 0.3, length(p * vec2(0.85, 1.0)));
      c *= mix(0.62, 1.0, v);
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);      // fargene er ferdige skjermfarger, akkurat som tåka
    }`
});
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakMat); m.frustumCulled = false; bakScene.add(m); }

const bakTopp = new THREE.Color(), bakBunn = new THREE.Color(), bakMidt = new THREE.Color();
const _fa = new THREE.Color(), _fb = new THREE.Color();
// nøkler: [bredde, toppfarge, bunnfarge, lysspill, skille mellom oppe og nede]
function oppdaterBakteppe(emne) {
  const n = emne.bak, l = Math.log10(bredde);
  let i = 0;
  while (i < n.length - 2 && l < Math.log10(n[i + 1][0])) i++;
  const a = n[i], b = n[i + 1];
  const t = jevn(Math.max(0, Math.min(1, (Math.log10(a[0]) - l) / (Math.log10(a[0]) - Math.log10(b[0])))));
  bakTopp.copy(_fa.set(a[1])).lerp(_fb.set(b[1]), t);
  bakBunn.copy(_fa.set(a[2])).lerp(_fb.set(b[2]), t);
  bakMidt.copy(bakTopp).lerp(bakBunn, 0.5);
  const u = bakMat.uniforms;
  u.uTopp.value.copy(bakTopp); u.uBunn.value.copy(bakBunn);
  u.uKaustikk.value = mellom(a[3], b[3], t);
  u.uSkille.value = mellom(a[4] || 0, b[4] || 0, t);
  u.uTid.value = tid; u.uL2.value = Math.log2(bredde); u.uAspekt.value = aspekt;
  // korn: vannmolekylene anes som uro før de kan skilles fra hverandre
  let korn = 0;
  if (emne.korn) {
    const pxPerMolekyl = W * emne.korn / synligBredde();
    korn = jevn((pxPerMolekyl - 1.2) / 5) * (1 - jevn(framdrift(7e-9, 4e-9, bredde)));
    u.uKornCeller.value = (synligBredde() / aspekt) / emne.korn;
  }
  u.uKorn.value = korn * 0.5;
}

// ================= Felles: elektronsky og atomkjerne =================
// Elektronene tegnes som en sky av prikker. Hver prikk er et sted der et elektron kunne vært
// funnet. Tettheten følger den virkelige fordelingen: to elektroner tett på kjernen, resten lenger ute.
function skyNivå(o) {
  // o.skall = [[andel, k, theta_pm], ...]: avstanden trekkes fra en gammafordeling
  const n = nivå({
    enhet: 1e-12, vis: o.vis, tåke: null,
    kamera: () => ({ foran: 1e9, bak: 1e9 }),
    bygg() {
      const rnd = lagRnd(o.frø || 7), N = 70000;
      const pos = new Float32Array(N * 3), fase = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        let u = rnd(), valgtSkall = o.skall[o.skall.length - 1];
        for (const sk of o.skall) { if (u < sk[0]) { valgtSkall = sk; break; } u -= sk[0]; }
        let prod = 1; for (let j = 0; j < valgtSkall[1]; j++) prod *= Math.max(1e-9, rnd());
        const r = -valgtSkall[2] * Math.log(prod);
        const cz = rnd() * 2 - 1, v = rnd() * TAU, sx = Math.sqrt(1 - cz * cz);
        pos[i * 3] = r * sx * Math.cos(v); pos[i * 3 + 1] = r * sx * Math.sin(v); pos[i * 3 + 2] = r * cz;
        fase[i] = rnd();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aFase', new THREE.BufferAttribute(fase, 1));
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uTid: { value: 0 }, uPx: { value: 4 }, uAlfa: { value: 1 }, uD: { value: 1 }, uBU: { value: 1 }, uFarge: { value: farge(o.farge || 0x5f9bff) }, uLys: { value: 0.2 } },
        vertexShader: `attribute float aFase; uniform float uTid, uPx, uD, uBU; varying float vA;
          void main(){
            vec3 p = position * (1.0 + 0.07 * sin(uTid * (0.7 + fract(aFase * 7.0)) + aFase * 40.0));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = uPx * (0.7 + 0.6 * fract(aFase * 31.0));
            vA = 0.45 + 0.55 * sin(uTid * 2.6 * (0.5 + fract(aFase * 13.0)) + aFase * 90.0);
            vA *= smoothstep(1.5, 0.5, abs(-mv.z - uD) / uBU);      // bare et lag rundt stedet vi ser på
          }`,
        fragmentShader: `uniform vec3 uFarge; uniform float uAlfa, uLys; varying float vA;
          void main(){
            float d = length(gl_PointCoord - 0.5);
            float a = smoothstep(0.5, 0.0, d);
            gl_FragColor = vec4(uFarge * a * a * vA * uAlfa * uLys, 1.0);
            #include <encodings_fragment>
          }`
      });
      n.mat.push(mat);
      n.sky = new THREE.Points(geo, mat); n.sky.frustumCulled = false;
      n.scene.add(n.sky);
      // kjernen i riktig størrelse er usynlig her, så den merkes med en liten lysende prikk
      const g2 = new THREE.BufferGeometry();
      g2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
      const m2 = new THREE.ShaderMaterial({
        transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uPx: { value: 4 }, uAlfa: { value: 1 } },

function kjerneNivå(o) {
  const n = nivå({
    enhet: 1e-15, vis: o.vis, tåke: null,
    kamera: () => ({ høyde: 0.12 }),
    bygg() {
      const s = n.scene; lysSett(s, 0.9);
      const rnd = lagRnd(o.frø || 3), A = o.Z + o.N, rN = 0.85, R = 1.22 * Math.cbrt(A) - rN * 0.55;
      const p = [];
      for (let i = 0; i < A; i++) {
        const cz = rnd() * 2 - 1, v = rnd() * TAU, r = Math.cbrt(rnd()) * R, sx = Math.sqrt(1 - cz * cz);
        p.push(new THREE.Vector3(r * sx * Math.cos(v), r * sx * Math.sin(v), r * cz));
      }
      for (let it = 0; it < 160; it++) {                 // dytter kulene fra hverandre til de ligger tett
        for (let i = 0; i < A; i++) for (let j = i + 1; j < A; j++) {
          const d = p[i].distanceTo(p[j]);
          if (d < rN * 1.86 && d > 1e-6) { const f = (rN * 1.86 - d) / d * 0.5; const dx = p[j].clone().sub(p[i]).multiplyScalar(f); p[i].sub(dx); p[j].add(dx); }
        }
        p.forEach(q => { const l = q.length(); if (l > R) q.multiplyScalar(R / l); q.multiplyScalar(0.995); });
      }
      // protoner og nøytroner blandes, slik de er i en virkelig kjerne
      const rekke = p.map((q, i) => [rnd(), i]).sort((a, b) => a[0] - b[0]), type = [];
      rekke.forEach(([_, idx], i) => { type[idx] = i < o.Z; });
      const geo = new THREE.SphereGeometry(rN, 48, 32);
      const mP = reg(n, new THREE.MeshStandardMaterial({ color: farge(0xd9412f), roughness: 0.42, metalness: 0.0, envMapIntensity: 0.9 }));
      const mN = reg(n, new THREE.MeshStandardMaterial({ color: farge(0x93a1b3), roughness: 0.42, metalness: 0.0, envMapIntensity: 0.9 }));
      n.gruppe = new THREE.Group(); s.add(n.gruppe);
      n.kuler = p.map((q, i) => { const m = new THREE.Mesh(geo, type[i] ? mP : mN); m.position.copy(q); m.userData = { p0: q.clone(), f: rnd() * 100 }; n.gruppe.add(m); return m; });
      const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
      const gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(255,190,140,.5)'); gr.addColorStop(0.5, 'rgba(255,120,80,.14)'); gr.addColorStop(1, 'rgba(255,90,60,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
      const glød = new THREE.Sprite(reg(n, new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })));
      glød.scale.setScalar(R * 7); n.glød = glød; n.R = R; s.add(glød);
    },
    oppdater() {
      n.glød.position.copy(kamera.position).normalize().multiplyScalar(-n.R * 1.8);     // gløden ligger bak kjernen
      n.gruppe.rotation.y = tid * 0.22; n.gruppe.rotation.x = Math.sin(tid * 0.13) * 0.35;
      for (const m of n.kuler) { const u = m.userData, t = tid * 2.3 + u.f;
        m.position.set(u.p0.x + Math.sin(t) * 0.07, u.p0.y + Math.sin(t * 1.31 + 1.0) * 0.07, u.p0.z + Math.sin(t * 0.83 + 2.0) * 0.07); }
    }
  });
  return n;
}

// Vannmolekylene ligger like tett som i virkelig vann: 33 molekyler per kubikknanometer
const VANN_O_R = 1.38, VANN_H_R = 1.02;          // litt under van der Waals-radius, så formen blir tydelig
function vannMolekyler() {
  const rnd = lagRnd(5), a = 3.104;
  const vb = 62 * (aspekt >= 1.3 ? 1 : Math.max(0.6, aspekt / 1.3));     // bredden på utsnittet idet molekylene tones inn
  const hx = vb / 2 * 1.2 + 2, hy = vb / aspekt / 2 * 1.2 + 2, dyp = 10;
  const liste = [];
  for (let x = -hx; x <= hx; x += a) for (let y = -hy; y <= hy; y += a) for (let z = -dyp; z <= 0.2; z += a) {
    const p = [x + (rnd() - 0.5) * 1.5, y + (rnd() - 0.5) * 1.5, z + (rnd() - 0.5) * 1.3];
    if (p[2] > 0.5) p[2] = 0.5 - rnd() * 0.6;
    if (Math.hypot(p[0], p[1], p[2]) < 3.0) continue;      // plass til molekylet vi skal inn i
    liste.push(p);
  }
  // molekylet i midten har seks nære naboer rundt seg i bildeplanet og bak
  [[2.9, 0.6, -0.3], [-2.85, 0.9, -0.5], [0.4, 2.95, -0.6], [1.6, -2.7, -0.9], [-1.7, -2.6, -0.4], [0.2, 0.3, -2.9]].forEach(p => liste.push(p));
  liste.sort((p, q) => Math.max(Math.abs(p[0]), Math.abs(p[1]) * aspekt) - Math.max(Math.abs(q[0]), Math.abs(q[1]) * aspekt));   // innenfra og ut
  return liste.map(p => {
    // tilfeldig retning og en tilfeldig akse molekylet vrir seg om
    const ret = () => { const cz = rnd() * 2 - 1, v = rnd() * TAU, sx = Math.sqrt(1 - cz * cz); return new THREE.Vector3(sx * Math.cos(v), sx * Math.sin(v), cz); };
    const kv = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), ret()).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * TAU));
    const k = ret(), del = v => { const kxv = new THREE.Vector3().crossVectors(k, v), kkv = k.clone().multiplyScalar(k.dot(v)); return [v.x, v.y, v.z, kxv.x, kxv.y, kxv.z, kkv.x, kkv.y, kkv.z]; };
    const h1 = new THREE.Vector3(0.757, -0.586, 0).applyQuaternion(kv), h2 = new THREE.Vector3(-0.757, -0.586, 0).applyQuaternion(kv);
    return { p, rad: Math.max(Math.abs(p[0]), Math.abs(p[1]) * aspekt), h1: del(h1), h2: del(h2), f: [rnd() * 100, rnd() * 100, rnd() * 100, rnd() * 100], w: 0.6 + rnd() * 0.9 };
  });
}

function vannNaboNivå() {
  const n = nivå({
    enhet: 1e-10, vis: [6.2e-9, 4e-9, 1.5e-9, 7.5e-10], tåke: 'midt', aspektAvhengig: true, kamera: vannKamera,
    bygg() {
      const s = n.scene; lysSett(s, 1); s.fog = new THREE.Fog(0x000000, 1, 2);
      n.mol = vannMolekyler();
      const N = n.mol.length; n.ytterst = n.mol[N - 1].rad;
      const mO = reg(n, new THREE.MeshStandardMaterial({ color: farge(0xd5362c), roughness: 0.38, metalness: 0, envMapIntensity: 0.75 }));
      const mH = reg(n, new THREE.MeshStandardMaterial({ color: farge(0xeef1f4), roughness: 0.42, metalness: 0, envMapIntensity: 0.75 }));
      n.O = new THREE.InstancedMesh(new THREE.SphereGeometry(VANN_O_R, 18, 12), mO, N);
      n.Hy = new THREE.InstancedMesh(new THREE.SphereGeometry(VANN_H_R, 14, 9), mH, N * 2);
      const m4 = new THREE.Matrix4();
      for (let i = 0; i < N; i++) { n.O.setMatrixAt(i, m4); n.Hy.setMatrixAt(i * 2, m4); n.Hy.setMatrixAt(i * 2 + 1, m4); }
      n.O.frustumCulled = n.Hy.frustumCulled = false;
      s.add(n.O); s.add(n.Hy);
    },
    oppdater(dt, a, k) {
      const o = n.O.instanceMatrix.array, h = n.Hy.instanceMatrix.array, mol = n.mol, t = tid;
      // molekylene er sortert innenfra og ut, så vi tegner bare dem som er i bildet
      const grense = k.bU / 2 * 1.3 + 4;
      let antall = mol.length;
      if (grense < n.ytterst) { let lo = 0, hi = mol.length; while (lo < hi) { const m = (lo + hi) >> 1; if (mol[m].rad < grense) lo = m + 1; else hi = m; } antall = lo; }
      n.O.count = antall; n.Hy.count = antall * 2;
      for (let i = 0; i < antall; i++) {
        const m = mol[i], f = m.f;
        const x = m.p[0] + Math.sin(t * 1.9 * m.w + f[0]) * 0.32, y = m.p[1] + Math.sin(t * 2.3 * m.w + f[1]) * 0.32, z = m.p[2] + Math.sin(t * 1.6 * m.w + f[2]) * 0.26;
        const v = Math.sin(t * 1.4 * m.w + f[3]) * 0.9 + Math.sin(t * 0.37 + f[0]) * 1.4, c = Math.cos(v), sn = Math.sin(v), e = 1 - c;
        let k = i * 16; o[k + 12] = x; o[k + 13] = y; o[k + 14] = z;
        const a = m.h1, b2 = m.h2;
        k = i * 32; h[k + 12] = x + a[0] * c + a[3] * sn + a[6] * e; h[k + 13] = y + a[1] * c + a[4] * sn + a[7] * e; h[k + 14] = z + a[2] * c + a[5] * sn + a[8] * e;
        k += 16; h[k + 12] = x + b2[0] * c + b2[3] * sn + b2[6] * e; h[k + 13] = y + b2[1] * c + b2[4] * sn + b2[7] * e; h[k + 14] = z + b2[2] * c + b2[5] * sn + b2[8] * e;
      }
      n.O.instanceMatrix.needsUpdate = true; n.Hy.instanceMatrix.needsUpdate = true;
    }
  });
  return n;
}

const membran = (() => {

    const rnd = lagRnd(21), prot = [];
    for (let gx = -40; gx <= 40; gx++) for (let gz = 0; gz < 36; gz++) {
      if (rnd() > 0.72) continue;
      const x = gx * 16 + (rnd() - 0.5) * 9, z = -4.5 - gz * 16 - rnd() * 8;

    }

      const m4 = new THREE.Matrix4();
      const legg = (sett, seg) => Object.entries(sett).forEach(([el, p]) => {
        const [hex, r] = ATOMER[el], fin = seg || (el === 'H' ? 10 : 14);
        const im = new THREE.InstancedMesh(new THREE.SphereGeometry(r, fin, Math.round(fin * 0.66)),
          reg(n, svai(new THREE.MeshStandardMaterial({ color: farge(hex), roughness: 0.42, metalness: 0, envMapIntensity: 0.7 }), 'atom')), p.length / 3);
        for (let i = 0; i < p.length / 3; i++) { m4.makeTranslation(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]); im.setMatrixAt(i, m4); }
        im.frustumCulled = false; s.add(im); n.andre.push(im);
      });
      legg(pos.fjern); legg(pos.nær, 40);
      const fk = new THREE.Mesh(new THREE.SphereGeometry(ATOMER.C[1], 48, 32),
        reg(n, new THREE.MeshStandardMaterial({ color: farge(0x565d66), roughness: 0.42, metalness: 0, envMapIntensity: 0.7 })));
      fk.position.copy(mal.fokus); fk.position.z -= 4.5; s.add(fk);
    },
    oppdater() {
      // naboatomene viker unna, så karbonatomet vi sikter på står alene før det løses opp i en sky
      const f = 1 - jevn(framdrift(1.5e-9, 7.5e-10, bredde));
      for (const im of n.andre) { im.visible = f > 0.004; im.material.opacity *= f; if (f < 0.999) im.material.transparent = true; }
      svaiTid.value = tid; atomUro.value = 0.13 * (1 - jevn(framdrift(1.6e-9, 6e-10, bredde))); }   // atomene dirrer, og roer seg når vi går helt inn
  });
  return n;
}

const CELLE = {

    [5e-10,  0x06080e, 0x06080e, 0, 0],

  ],
  lagNivåer: () => [

      modell: 'Protoner og nøytroner er tegnet som kuler. De er selv bygd av enda mindre partikler, kvarker.',
      forklaring: [['#d9412f', 'proton'], ['#93a1b3', 'nøytron']] }

// ================= Tegning, valg og styring =================
const EMNER = { vann: VANN };
if (typeof CELLE !== 'undefined') EMNER.celle = CELLE;
Object.values(EMNER).forEach(e => { e.nivåer = null; });

function størrelse() {
  const r = $('scene').getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); aspekt = W / H;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(W, H, false);
  kamera.aspect = aspekt;
}

function tømNivå(n) {
  n.scene.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  n.mat.forEach(m => m.dispose());
  n.scene = new THREE.Scene(); n.mat = []; n.bygget = false;
}
function klargjør(n) {
  if (n.bygget && n.aspektAvhengig && Math.abs(aspekt / n.aspektBygget - 1) > 0.3) tømNivå(n);
  if (!n.bygget) { n.bygg(); n.bygget = true; n.aspektBygget = aspekt; }
}

let visteKapittel = null;
function tegn(nå) {
  const dt = Math.min(0.05, (nå - sisteRamme) / 1000 || 0);
  sisteRamme = nå; tid += dt;
  const emne = EMNER[valgt];
  if (reiser) {
    bredde *= Math.pow(10, -dt * 0.3);
    if (bredde <= emne.slutt) { bredde = emne.slutt; settReiser(false); }
    oppdaterSkyv();
  }
  if (!emne.nivåer) emne.nivåer = emne.lagNivåer();
  renderer.clear();
  oppdaterBakteppe(emne);
  renderer.render(bakScene, bakKamera);
  for (const n of emne.nivåer) {
    const a = vindu(n.vis, bredde);
    if (a <= 0) continue;
    klargjør(n);
    settAlfa(n, a);
    const k = stillKamera(n);
    if (n.scene.fog) n.scene.fog.color.copy(n.tåke === 'topp' ? bakTopp : n.tåke === 'bunn' ? bakBunn : bakMidt);
    if (n.oppdater) n.oppdater(dt, a, k);
    renderer.clearDepth();
    renderer.render(n.scene, kamera);
  }
  const kap = emne.kapitler.find(k => bredde > k.til) || emne.kapitler[emne.kapitler.length - 1];
  if (kap !== visteKapittel) {
    visteKapittel = kap;
    $('tittel').textContent = kap.tittel; $('tekst').textContent = kap.tekst;
    $('modellnote').hidden = !kap.modell; $('modellnote').textContent = kap.modell || '';
    $('forklaring').hidden = !kap.forklaring;
    $('forklaring').innerHTML = (kap.forklaring || []).map(([f, t]) => `<span><i style="background:${f}"></i>${t}</span>`).join('').replace(/<\/i><\/span><span>/g, '</i>');
  }
  $('forstorrelse').textContent = forstørrelse(bredde);
  $('bredde').textContent = 'Utsnittet er ' + lengde(synligBredde()) + ' bredt';
  requestAnimationFrame(tegn);
}

// glidebryteren går i jevne tierpotenser fra start til kjernen
function oppdaterSkyv() {
  const e = EMNER[valgt], a = Math.log10(e.start), b = Math.log10(e.slutt);
  $('skyv').value = Math.round(Math.max(0, Math.min(1, (a - Math.log10(bredde)) / (a - b))) * 1000);
}
function settBredde(b) {
  const e = EMNER[valgt];
  bredde = Math.max(e.slutt, Math.min(e.start, b));
  oppdaterSkyv();
}
function settReiser(på) {
  reiser = på;
  $('reisBtn').textContent = på ? '⏸ Stopp' : '▶ Reis innover';
  $('reisBtn').classList.toggle('primary', på);
}
function velgEmne(id) {
  valgt = id;
  $('velg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === id));
  settReiser(false);
  settBredde(EMNER[id].start);
}

function start() {
  omgivelse = lagOmgivelse();
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.autoClear = false;
  renderer.setClearColor(0x05070b, 1);

  $('velg').innerHTML = Object.entries(EMNER).map(([id, e]) => `<button data-id="${id}" aria-pressed="${id === valgt}">${e.navn}</button>`).join('');
  $('velg').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) velgEmne(b.dataset.id); });
  $('skyv').addEventListener('input', ev => {
    settReiser(false);
    const e = EMNER[valgt], a = Math.log10(e.start), b = Math.log10(e.slutt);
    bredde = Math.pow(10, a - (ev.target.value / 1000) * (a - b));
  });
  const zoom = faktor => { settReiser(false); settBredde(bredde * faktor); };
  $('innZoom').addEventListener('click', () => zoom(1 / 1.8));
  $('utZoom').addEventListener('click', () => zoom(1.8));
  $('utBtn').addEventListener('click', () => { settReiser(false); settBredde(EMNER[valgt].start); });
  $('reisBtn').addEventListener('click', () => {
    if (!reiser && bredde <= EMNER[valgt].slutt * 1.01) settBredde(EMNER[valgt].start);
    settReiser(!reiser);
  });

  const scene = $('scene');
  scene.addEventListener('wheel', ev => { ev.preventDefault(); settReiser(false); settBredde(bredde * Math.exp(ev.deltaY * 0.0016)); }, { passive: false });
  let dra = null, knip = null;
  const pekere = new Map();
  scene.addEventListener('pointerdown', ev => {
    try { scene.setPointerCapture(ev.pointerId); } catch (e) {}
    pekere.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pekere.size === 2) { const [a, b] = [...pekere.values()]; knip = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, b0: bredde }; dra = null; }
    else dra = { y: ev.clientY, b0: bredde };
    settReiser(false);
  });
  scene.addEventListener('pointermove', ev => {
    if (!pekere.has(ev.pointerId)) return;
    pekere.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (knip && pekere.size >= 2) { const [a, b] = [...pekere.values()]; settBredde(knip.b0 * knip.d0 / (Math.hypot(a.x - b.x, a.y - b.y) || 1)); }
    else if (dra) settBredde(dra.b0 * Math.exp((ev.clientY - dra.y) * 0.006));
  });
  const slipp = ev => { pekere.delete(ev.pointerId); if (pekere.size < 2) knip = null; if (!pekere.size) dra = null; };
  scene.addEventListener('pointerup', slipp); scene.addEventListener('pointercancel', slipp);
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'BUTTON') return;
    if (ev.key === 'ArrowDown' || ev.key === '+') { zoom(1 / 1.4); ev.preventDefault(); }
    if (ev.key === 'ArrowUp' || ev.key === '-') { zoom(1.4); ev.preventDefault(); }
    if (ev.key === ' ') { $('reisBtn').click(); ev.preventDefault(); }
  });

  new ResizeObserver(størrelse).observe(scene);
  størrelse();
  velgEmne('vann');
  requestAnimationFrame(tegn);
}

if (renderer) start();
else {
  $('scene').insertAdjacentHTML('beforeend', `<div class="feil"><div><strong>Denne siden trenger 3D-grafikk (WebGL), og det får den ikke til å starte her.</strong>
    <br>Prøv en annen nettleser eller maskin, eller bruk <a href="zoom-enkel.html">den enkle versjonen</a>.</div></div>`);
  $('lerret').hidden = true;
}

</script>
