# Lærespill (laerespill.netlify.app)
# Forside med innlogging, og ett fag per mappe: matte/, naturfag/, flerfaglig/ ...
[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Felles filer hentes fra fellesting. Adressen i nettleseren blir stående,
# så spillene bruker /js/... og /baner/...
[[redirects]]
  from = "/js/*"
  to = "https://fellesting.netlify.app/js/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/baner/*"
  to = "https://fellesting.netlify.app/baner/:splat"
  status = 200
  force = true

# Lærersiden ligger i fellesting
[[redirects]]
  from = "/laerer.html"
  to = "https://fellesting.netlify.app/laerer.html"
  status = 301
  force = true

